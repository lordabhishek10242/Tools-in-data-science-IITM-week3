services:
  - type: web
    name: invoice-action-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: question 2
    dockerfilePath: question 2/Dockerfile
    dockerContext: question 2
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      - key: A2A_BASE_PATH
        value: /a2a
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-agent-db
          property: connectionString
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: PORT
        value: "10000"
databases:
  - name: invoice-agent-db
    databaseName: invoice_agent
    plan: free
    region: singapore

