services:
  - type: web
    name: invoice-action-agent
    runtime: docker
    plan: free
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: A2A_BASE_PATH
        value: /a2a
      - key: DATABASE_PATH
        value: /data/invoice-agent.sqlite3
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-agent-db
          property: connectionString
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
databases:
  - name: invoice-agent-db
    databaseName: invoice_agent
    plan: free

